# Nginx reverse proxy for WA Automations.
# Install at /etc/nginx/sites-available/waautomation.peculiex.com and symlink
# into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Routing: the Next.js app owns everything except /api and /webhooks, which
# go to the Express API — this lets the frontend call NEXT_PUBLIC_API_URL as
# same-origin (https://waautomation.peculiex.com/api), and lets Meta reach
# the WhatsApp webhook at https://waautomation.peculiex.com/webhooks/whatsapp
# without a separate subdomain or CORS setup.

server {
    listen 80;
    server_name waautomation.peculiex.com;

    # Meta's webhook needs the raw request body untouched.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is working on plain HTTP, switch to HTTPS with:
#   sudo certbot --nginx -d waautomation.peculiex.com
# Certbot rewrites this file to add the SSL server block and redirect
# HTTP → HTTPS automatically — no manual cert paths to fill in.
